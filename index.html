<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1 id="heading">Tic Tac Toe Game</h1>
    <div id="main-div">
        <div id="boxes">
            <div class="column">
                <div id="1"></div>
                <div id="2"></div>
                <div id="3"></div>
            </div>
            <div class="column">
                <div id="4"></div>
                <div id="5"></div>
                <div id="6"></div>
            </div>
            <div class="column">
                <div id="7"></div>
                <div id="8"></div>
                <div id="9"></div>
            </div>
        </div>
    </div>
    <h1 id="game-status">Game Start!</h1>
    <button id="clear-button">New Game</button>
</body>
</html>
